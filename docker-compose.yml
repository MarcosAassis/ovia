services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CORS_ORIGINS: "http://localhost:3000"
      DATABASE_PATH: "/data/ovia.db"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-oviatechsolutions@gmail.com}"
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-OVIA Tech <onboarding@resend.dev>}"
    volumes:
      - api-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  api-data:
